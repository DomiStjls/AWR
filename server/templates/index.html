<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>RoboMarvel WMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #ececec;
            color: #222;
        }

        .card {
            border: none;
            border-radius: 12px;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        h2,
        h4 {
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border-radius: 8px;
        }

        .btn-primary {
            background: #303030;
            border-color: #303030;
        }

        .btn-primary:hover {
            background: #505050;
            border-color: #505050;
        }

        .progress {
            height: 8px;
            background: #d8d8d8;
        }

        .progress-bar {
            background: #444;
        }

        .table td,
        .table th {
            vertical-align: middle;
        }

        .status-online {
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="container mt-4">
        <h2 class="mb-4">RoboMarvel Warehouse Control</h2>

        <div class="row">
            <div class="col-md-4">
                <div class="card p-3">
                    <h4>Робот</h4>
                    <!-- <p class="status-online">ONLINE</p> -->
                    <p>X: <span id="robot_x">Nan</span></p>
                    <p>Y: <span id="robot_y">Nan</span></p>
                    <!-- <p>Battery: <span id="battery">100</span> %</p> -->
                    <p>State: <span id="status">Idle</span></p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3">
                    <h4>Create task</h4>
                    <div class="mb-3">
                        <label>Name</label>
                        <input class="form-control" id="item_name" placeholder="Box">
                    </div>
                    <div class="mb-3">
                        <label>Weight</label>
                        <input class="form-control" id="item_weight" type="number" value="1" min="0.1" step="0.1">
                    </div>
                    <div class="mb-3">
                        <label>From</label>
                        <select class="form-select" id="from"></select>
                    </div>
                    <div class="mb-3">
                        <label>To</label>
                        <select class="form-select" id="to"></select>
                    </div>
                    <button class="btn btn-primary w-100" onclick="createTask()">Create</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card p-3 mb-3">
                    <h4>Склады</h4>
                    <div id="warehouses">Загрузка...</div>
                </div>
                <div class="card p-3">
                    <h4>Пункты выдачи</h4>
                    <div id="pickups">Загрузка...</div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col">
                <div class="card p-3">
                    <h4>Очередь задач</h4>
                    <div id="tasks">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadSelects() {
            const res = await fetch("/locations");
            const locs = await res.json();
            const fromSel = document.getElementById("from");
            const toSel = document.getElementById("to");
            fromSel.innerHTML = "";
            toSel.innerHTML = "";
            for (let id in locs) {
                const opt1 = document.createElement("option");
                opt1.value = id;
                opt1.textContent = id;
                fromSel.appendChild(opt1);
                const opt2 = document.createElement("option");
                opt2.value = id;
                opt2.textContent = id;
                toSel.appendChild(opt2);
            }
        }

        async function loadRobot() {
            const res = await fetch("/robot_status");
            const robot = await res.json();
            document.getElementById("robot_x").textContent = robot.x ?? "-";
            document.getElementById("robot_y").textContent = robot.y ?? "-";
            // document.getElementById("battery").textContent = robot.battery ?? "-";
            document.getElementById("status").textContent = robot.status ?? "Unknown";
        }

        async function loadTasks() {
            const [tasksRes, itemsRes] = await Promise.all([
                fetch("/tasks"),
                fetch("/items")
            ]);
            const tasks = await tasksRes.json();
            const allItems = await itemsRes.json();
            let html = "";
            if (tasks.length === 0) {
                html = "<p class='text-muted'>Нет задач</p>";
            } else {
                tasks.forEach(task => {
                    const item = allItems[task.item_id] || {};
                    const statusColor = {
                        "waiting": "bg-secondary",
                        "assigned": "bg-warning text-dark",
                        "done": "bg-success"
                    }[task.status] || "bg-secondary";
                    html += `
                    <div class="border rounded p-2 mb-2">
                        <b>${item.name ?? "???"}</b> (вес: ${item.weight ?? "?"})<br>
                        ${task.from} &rarr; ${task.to}<br>
                        <span class="badge ${statusColor}">${task.status}</span>
                    </div>`;
                });
            }
            document.getElementById("tasks").innerHTML = html;
        }

        async function loadWarehouses() {
            const [whRes, itemsRes] = await Promise.all([
                fetch("/warehouses"),
                fetch("/items")
            ]);
            const warehouses = await whRes.json();
            const allItems = await itemsRes.json();
            let html = "";
            for (let name in warehouses) {
                let wh = warehouses[name];
                let usedWeight = 0;
                wh.items.forEach(id => {
                    if (allItems[id]) usedWeight += allItems[id].weight;
                });
                let pct = wh.capacity > 0 ? (100 * usedWeight / wh.capacity) : 0;
                pct = Math.min(100, Math.max(0, pct));
                html += `
                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <span class="fw-bold">${name}</span>
                        <small class="text-muted">${usedWeight.toFixed(1)}/${wh.capacity}</small>
                    </div>
                    <div class="progress">
                        <div class="progress-bar" style="width:${pct}%"></div>
                    </div>
                    <small class="text-muted">${wh.items.length} грузов, свободно ${(wh.capacity - usedWeight).toFixed(1)}</small>
                </div>`;
            }
            document.getElementById("warehouses").innerHTML = html || "<p class='text-muted'>Нет складов</p>";
        }

        async function loadPickups() {
            const [puRes, itemsRes] = await Promise.all([
                fetch("/pickups"),
                fetch("/items")
            ]);
            const pickups = await puRes.json();
            const allItems = await itemsRes.json();
            let html = "";
            for (let name in pickups) {
                let pu = pickups[name];
                let totalWeight = 0;
                pu.items.forEach(id => {
                    if (allItems[id]) totalWeight += allItems[id].weight;
                });
                html += `
                <div class="mb-2">
                    <div class="d-flex justify-content-between">
                        <span class="fw-bold">${name}</span>
                        <small class="text-muted">${pu.items.length} грузов, ${totalWeight.toFixed(1)} кг</small>
                    </div>
                </div>`;
            }
            document.getElementById("pickups").innerHTML = html || "<p class='text-muted'>Нет пунктов выдачи</p>";
        }

        async function createTask() {
            const body = {
                item: {
                    name: document.getElementById("item_name").value || "Box",
                    weight: Number(document.getElementById("item_weight").value) || 1
                },
                from: document.getElementById("from").value,
                to: document.getElementById("to").value
            };
            const res = await fetch("/create_task", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                const err = await res.json();
                alert("Ошибка: " + (err.error || res.statusText));
                return;
            }
            document.getElementById("item_name").value = "box1";
            document.getElementById("item_weight").value = "1";
            loadTasks();
            loadWarehouses();
            loadPickups();
        }

        async function update() {
            await Promise.all([
                loadRobot(),
                loadWarehouses(),
                loadPickups()
            ]);
        }
        update();
        setInterval(update, 500);
        async function update1() {
            await Promise.all([
                loadTasks(),
            ]);
        }
        update1();
        setInterval(update1, 2000);

        async function update2() {
            await Promise.all([
                loadSelects(),
            ]);
        }
        update2();
        setInterval(update2, 10000);
    </script>
</body>

</html>
